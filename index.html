<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gear Puzzles</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101418;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        /* Pointer drags move gears, not the page. */
        touch-action: none;
        position: relative;
      }
      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        border-radius: 10px;
        background: rgb(20 26 32 / 85%);
        color: #d8dee4;
        font:
          15px/1.5 system-ui,
          sans-serif;
        pointer-events: none;
      }
      .label-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .axle-label {
        padding: 2px 6px;
        border-radius: 6px;
        background: rgb(20 26 32 / 75%);
        color: #d8dee4;
        font:
          12px/1.35 system-ui,
          sans-serif;
        text-align: center;
        white-space: pre;
      }
      .hud-status {
        color: #9aa7b4;
      }
      .hud-status[data-kind='solved'] {
        color: #2fd3c0;
        font-weight: 600;
      }
      .hud-status[data-kind='jammed'] {
        color: #e0633a;
      }
      .hud-next {
        display: block;
        margin-top: 8px;
        padding: 6px 12px;
        border: 0;
        border-radius: 6px;
        background: #2fd3c0;
        color: #0d1a1c;
        font:
          600 14px system-ui,
          sans-serif;
        cursor: pointer;
        pointer-events: auto;
      }
      .hud-next[hidden] {
        display: none;
      }
      .hud-hint {
        margin-top: 4px;
        color: #e0633a;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
